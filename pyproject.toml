[project]
name = "egohome"
version = "0.1.0"
description = "Prompts and metrics for the EgoHome egocentric annotation benchmark"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["egohome"]
